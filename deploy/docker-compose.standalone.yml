# =============================================================================
# YAGMCP — Docker Compose (Server + Open WebUI)
#
# A reverse-engineering analysis stack that talks to an EXTERNAL
# OpenAI-compatible LLM endpoint (vLLM or NVIDIA NIM).
#
# This stack is no longer self-contained: it does NOT bundle a model server.
# Llama 4 Maverick is served tensor-parallel across the DGX Spark pair, which
# needs GPUs and ~400B weights — not something compose can stand up locally.
# Point LLM_BASE_URL at whatever OpenAI-compatible endpoint you have.
#
# Usage:
#   cp .env.standalone.template .env.standalone
#   # set LLM_BASE_URL / LLM_MODEL / LLM_API_KEY in that file
#   docker compose -f docker-compose.standalone.yml up -d
#
# Verify the endpoint is reachable first:
#   curl "$LLM_BASE_URL/models"
#
# Browser access:
#   Open WebUI:  http://localhost:3000
#   YAGMCP:      http://localhost:8889
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # YAGMCP Server — MCP analysis server
  # ---------------------------------------------------------------------------
  yagmcp-server:
    # Pull from GitHub Container Registry (preferred)
    image: ghcr.io/roostercoopllc/yagmcp-server:latest
    container_name: yagmcp-server
    restart: unless-stopped
    # Fallback: build locally if GHCR image is unavailable
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      # External OpenAI-compatible endpoint. The "/v1" suffix is optional.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.0.25:8001/v1}
      LLM_MODEL: ${LLM_MODEL:-RedHatAI/Llama-4-Maverick-17B-128E-Instruct-quantized.w4a16}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      REPOS_DIR: ${REPOS_DIR:-/repos}
      MAX_CACHED_PROGRAMS: ${MAX_CACHED_PROGRAMS:-5}
      GHIDRA_ASSIST_PORT: ${GHIDRA_ASSIST_PORT:-8889}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8889:8889"
    volumes:
      # Read-only access to Ghidra repositories
      - ./repos:/repos:ro
      # Persistent cache/data directory
      - yagmcp_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8889/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - yagmcp_net

  # ---------------------------------------------------------------------------
  # Open WebUI — Browser-based chat frontend
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: yagmcp-webui
    restart: unless-stopped
    environment:
      # Point Open WebUI at the same OpenAI-compatible endpoint.
      OPENAI_API_BASE_URL: ${LLM_BASE_URL:-http://192.168.0.25:8001/v1}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      # Without this Open WebUI keeps probing localhost:11434 and the model
      # picker stalls for ~10s on every page load.
      ENABLE_OLLAMA_API: "false"
      # Optional: Allow insecure HTTP (needed for localhost development)
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me-in-production}
    ports:
      - "3000:8080"
    volumes:
      # Persistent data directory for WebUI
      - webui_data:/app/backend/data
    networks:
      - yagmcp_net

# ---------------------------------------------------------------------------
# Named volumes (persistent data)
# ---------------------------------------------------------------------------
volumes:
  yagmcp_data:
    driver: local
  webui_data:
    driver: local

# ---------------------------------------------------------------------------
# Docker network (all services communicate here)
# ---------------------------------------------------------------------------
networks:
  yagmcp_net:
    driver: bridge
